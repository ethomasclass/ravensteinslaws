  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

gba(255,240,200,.6) 0 1px,transparent 1.8px),repeating-linear-gradient(180deg,rgba(169,196,232,.13) 0 68px,rgba(169,196,232,0) 68px 136px),linear-gradient(#262c66,#2f3577)\">\n  <div style=\"position:absolute;inset:0;z-index:-1;pointer-events:none;background-image:url('data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%27200%27%20height%3D%27200%27%3E%3Cfilter%20id%3D%27n%27%3E%3CfeTurbulence%20type%3D%27fractalNoise%27%20baseFrequency%3D%27.9%27%20numOctaves%3D%272%27%20stitchTiles%3D%27stitch%27%2F%3E%3CfeColorMatrix%20values%3D%270%200%200%200%200%200%200%200%200%200%200%200%200%200%200%200%200%200%20.55%200%27%2F%3E%3C%2Ffilter%3E%3Crect%20width%3D%27200%27%20height%3D%27200%27%20filter%3D%27url(%23n)%27%2F%3E%3C%2Fsvg%3E');background-size:200px 200px;opacity:.35;mix-blend-mode:multiply\"><\u002Fdiv>\n  <div style=\"position:absolute;inset:34px;border:2px solid rgba(214,190,120,.55);box-shadow:inset 0 0 0 8px #2b3170,inset 0 0 0 10px rgba(169,196,232,.4);pointer-events:none\"><\u002Fdiv>\n  <div style=\"position:absolute;left:150px;top:160px;display:flex;flex-direction:column;gap:22px;max-width:1300px\">\n    <div style=\"font-size:26px;letter-spacing:.24em;text-transform:uppercase;color:#e9a23b;font-weight:700\">AP Human Geography · Unit 2 · Data Lab<\u002Fdiv>\n    <div style=\"font-family:'DM Serif Display',serif;font-size:72px;line-height:1;color:#f6ead6\">Ravenstein's<\u002Fdiv>\n    <h1 style=\"margin:-10px 0 0;font-family:'Caveat',cursive;font-weight:700;font-size:190px;line-height:.95;color:#b7d0f0;text-wrap:balance\">Laws of Migration<\u002Fh1>\n    <p style=\"margin:14px 0 0;font-size:34px;line-height:1.4;max-width:960px;color:#f6ead6;opacity:.9;text-wrap:pretty\">Written in 1885 from British census records. Do they still describe how people move today? Test each law against real data from seven countries.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"position:absolute;left:150px;bottom:90px;font-size:24px;color:#b7d0f0\">9 laws · 7 countries · one class period<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Meet Ravenstein\" data-screen-label=\"02\" data-speaker-notes=\"He was a migrant himself: Frankfurt to London at 18. Point out the irony that a cartographer for the War Office wrote the founding paper of migration studies.\" style=\"width:1920px;height:1080px;position:relative;overflow:hidden;isolation:isolate;box-sizing:border-box;padding:110px 150px;background:repeating-linear-gradient(180deg,rgba(169,196,232,.10) 0 68px,rgba(169,196,232,0) 68px 136px),#262c66;color:#f6ead6;font-family:'Nunito Sans',sans-serif;display:grid;grid-template-columns:1fr 560px;gap:90px;align-items:center\">\n  <div style=\"position:absolute;inset:0;z-index:-1;pointer-events:none;background-image:url('data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%27200%27%20height%3D%27200%27%3E%3Cfilter%20id%3D%27n%27%3E%3CfeTurbulence%20type%3D%27fractalNoise%27%20baseFrequency%3D%27.9%27%20numOctaves%3D%272%27%20stitchTiles%3D%27stitch%27%2F%3E%3CfeColorMatrix%20values%3D%270%200%200%200%200%200%200%200%200%200%200%200%200%200%200%200%200%200%20.55%200%27%2F%3E%3C%2Ffilter%3E%3Crect%20width%3D%27200%27%20height%3D%27200%27%20filter%3D%27url(%23n)%27%2F%3E%3C%2Fsvg%3E');background-size:200px 200px;opacity:.35;mix-blend-mode:multiply\"><\u002Fdiv>\n  <div style=\"position:absolute;inset:34px;border:2px solid rgba(214,190,120,.55);box-shadow:inset 0 0 0 8px #262c66,inset 0 0 0 10px rgba(169,196,232,.4);pointer-events:none\"><\u002Fdiv>\n  <div style=\"display:flex;flex-direction:column;gap:30px\">\n    <div style=\"font-size:24px;letter-spacing:.22em;text-transform:uppercase;color:#e9a23b;font-weight:700\">Who wrote the laws?<\u002Fdiv>\n    <h2 style=\"margin:0;font-family:'DM Serif Display',serif;font-weight:400;font-size:76px;line-height:1.05\">Ernst Georg Ravenstein <span style=\"font-family:'Caveat',cursive;color:#b7d0f0;font-size:64px\">1834–1913<\u002Fspan><\u002Fh2>\n    <p style=\"margin:0;font-size:29px;line-height:1.5;text-wrap:pretty;max-width:1000px\">A German cartographer who moved to London at 18, a migrant himself. He spent twenty years drawing maps for the British War Office, then turned to the census. In 1885 he read a paper to the Royal Statistical Society called <em>The Laws of Migration<\u002Fem>, built from one question on the 1881 UK census: <strong>where were you born?<\u002Fstrong><\u002Fp>\n    <p style=\"margin:0;font-size:29px;line-height:1.5;text-wrap:pretty;max-width:1000px\">By comparing birthplace to current county for every person in Britain, he spotted patterns no one had written down before. Geographers still use his \"laws\" as the starting point for studying why people move.<\u002Fp>\n    <div style=\"font-family:'Caveat',cursive;font-size:38px;color:#f3c477\">He also founded a gymnastics society in London. Geographers contain multitudes.<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:flex;flex-direction:column;gap:18px\">\n    <div style=\"width:560px;height:560px;border:2px solid rgba(214,190,120,.55);padding:12px;box-sizing:border-box\"><image-slot id=\"ravenstein-portrait\" shape=\"rect\" fit=\"contain\" src=\"https://commons.wikimedia.org/wiki/Special:FilePath/ErnstGeorgRavenstein.jpg?width=1600\" credit=\"Gallica / BnF via Wikimedia Commons, public domain\" placeholder=\"Drop a portrait of E. G. Ravenstein (public domain)\"><\u002Fimage-slot><\u002Fdiv>\n    <div style=\"font-size:22px;color:#b7d0f0;text-align:center\">Source data: UK Census 1871 and 1881, birthplace tables<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"The laws at a glance\" data-screen-label=\"03\" data-speaker-notes=\"Reminder slide. Each tile is one leg of the lab, in order. Students record a verdict for each on the worksheet.\" style=\"position:relative;overflow:hidden;isolation:isolate;width:1920px;height:1080px;box-sizing:border-box;padding:90px 130px;background:#f6ead6;color:#1d1a2b;font-family:'Nunito Sans',sans-serif;display:flex;flex-direction:column;gap:44px\">\n  <div style=\"position:absolute;inset:0;z-index:-1;pointer-events:none;background-image:url('data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%27200%27%20height%3D%27200%27%3E%3Cfilter%20id%3D%27n%27%3E%3CfeTurbulence%20type%3D%27fractalNoise%27%20baseFrequency%3D%27.9%27%20numOctaves%3D%272%27%20stitchTiles%3D%27stitch%27%2F%3E%3CfeColorMatrix%20values%3D%270%200%200%200%200%200%200%200%200%200%200%200%200%200%200%200%200%200%20.55%200%27%2F%3E%3C%2Ffilter%3E%3Crect%20width%3D%27200%27%20height%3D%27200%27%20filter%3D%27url(%23n)%27%2F%3E%3C%2Fsvg%3E');background-size:200px 200px;opacity:.5;mix-blend-mode:multiply\"><\u002Fdiv>\n  <div style=\"display:flex;flex-direction:column;gap:12px\">\n    <div style=\"font-size:24px;letter-spacing:.22em;text-transform:uppercase;color:#c2641f;font-weight:700\">Reminder<\u002Fdiv>\n    <h2 style=\"margin:0;font-family:'DM Serif Display',serif;font-weight:400;font-size:70px;line-height:1.05\">The nine laws you will test today<\u002Fh2>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:22px\">\n    <sc-for list=\"{{ lawTiles }}\" as=\"t\" hint-placeholder-count=\"9\">\n      <div style=\"background:#fff8ec;border:2px solid #e6d3b3;border-radius:8px;padding:26px 28px;display:grid;grid-template-columns:70px 1fr;gap:16px;align-items:start\">\n        <div style=\"font-family:'Caveat',cursive;font-size:64px;line-height:.9;color:#c2641f\">{{ t.n }}<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:8px\">\n          <div style=\"font-size:28px;font-weight:700\">{{ t.name }}<\u002Fdiv>\n          <div style=\"font-size:23px;line-height:1.4;color:#3d3950;text-wrap:pretty\">{{ t.text }}<\u002Fdiv>\n          <div style=\"font-size:21px;color:#6b6580;margin-top:4px\">Case: {{ t.country }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Vocabulary\" data-screen-label=\"04\" data-speaker-notes=\"Quick review only. Students should already know these from Unit 2 lessons.\" style=\"width:1920px;height:1080px;position:relative;overflow:hidden;isolation:isolate;box-sizing:border-box;padding:100px 150px;background:repeating-linear-gradient(180deg,rgba(169,196,232,.10) 0 68px,rgba(169,196,232,0) 68px 136px),#262c66;color:#f6ead6;font-family:'Nunito Sans',sans-serif;display:flex;flex-direction:column;gap:56px\">\n  <div style=\"position:absolute;inset:0;z-index:-1;pointer-events:none;background-image:url('data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%27200%27%20height%3D%27200%27%3E%3Cfilter%20id%3D%27n%27%3E%3CfeTurbulence%20type%3D%27fractalNoise%27%20baseFrequency%3D%27.9%27%20numOctaves%3D%272%27%20stitchTiles%3D%27stitch%27%2F%3E%3CfeColorMatrix%20values%3D%270%200%200%200%200%200%200%200%200%200%200%200%200%200%200%200%200%200%20.55%200%27%2F%3E%3C%2Ffilter%3E%3Crect%20width%3D%27200%27%20height%3D%27200%27%20filter%3D%27url(%23n)%27%2F%3E%3C%2Fsvg%3E');background-size:200px 200px;opacity:.35;mix-blend-mode:multiply\"><\u002Fdiv>\n  <div style=\"position:absolute;inset:34px;border:2px solid rgba(214,190,120,.55);box-shadow:inset 0 0 0 8px #262c66,inset 0 0 0 10px rgba(169,196,232,.4);pointer-events:none\"><\u002Fdiv>\n  <div style=\"display:flex;flex-direction:column;gap:14px\">\n    <div style=\"font-size:24px;letter-spacing:.22em;text-transform:uppercase;color:#e9a23b;font-weight:700\">Vocabulary check<\u002Fdiv>\n    <h2 style=\"margin:0;font-family:'DM Serif Display',serif;font-weight:400;font-size:72px;line-height:1.05\">Terms you will use today<\u002Fh2>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:22px 70px\">\n    <sc-for list=\"{{ vocab }}\" as=\"v\" hint-placeholder-count=\"8\">\n      <div style=\"display:grid;grid-template-columns:300px 1fr;gap:24px;padding:16px 0;border-bottom:1px solid rgba(246,234,214,.18);align-items:baseline\">\n        <div style=\"font-family:'DM Serif Display',serif;font-size:31px;color:#b7d0f0\">{{ v.term }}<\u002Fdiv>\n        <div style=\"font-size:24px;line-height:1.4;opacity:.9\">{{ v.def }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Law 1 · Short distance\" data-screen-label=\"05\" data-speaker-notes=\"Census of India 2011: 454 million internal migrants, 62% never left their district. Marriage migration is the single biggest reason anyone moves in India. Then/now: Ravenstein found the same in 1881 Britain, most movers went to the adjoining county.\" style=\"position:relative;overflow:hidden;isolation:isolate;width:1920px;height:1080px;box-sizing:border-box;background:#f6ead6;color:#1d1a2b;font-family:'Nunito Sans',sans-serif;display:grid;grid-template-columns:620px 1fr\">\n  <div style=\"position:absolute;inset:0;z-index:-1;pointer-events:none;background-image:url('data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%27200%27%20height%3D%27200%27%3E%3Cfilter%20id%3D%27n%27%3E%3CfeTurbulence%20type%3D%27fractalNoise%27%20baseFrequency%3D%27.9%27%20numOctaves%3D%272%27%20stitchTiles%3D%27stitch%27%2F%3E%3CfeColorMatrix%20values%3D%270%200%200%200%200%200%200%200%200%200%200%200%200%200%200%200%200%200%20.55%200%27%2F%3E%3C%2Ffilter%3E%3Crect%20width%3D%27200%27%20height%3D%27200%27%20filter%3D%27url(%23n)%27%2F%3E%3C%2Fsvg%3E');background-size:200px 200px;opacity:.5;mix-blend-mode:multiply\"><\u002Fdiv>\n  <div style=\"position:relative;height:1080px\">\n    <image-slot id=\"img-l1\" shape=\"rect\" src=\"https://commons.wikimedia.org/wiki/Special:FilePath/A%20Baraat%20procession%2C%20Jaipur.jpg?width=1600\" credit=\"Wikimedia Commons, CC BY-SA\" placeholder=\"Drop a photo: village wedding procession\"><\u002Fimage-slot>\n    <div style=\"position:absolute;inset:0;background:linear-gradient(180deg,rgba(38,44,102,0) 45%,rgba(38,44,102,.94));pointer-events:none\"><\u002Fdiv>\n    <div style=\"position:absolute;left:44px;right:44px;bottom:44px;display:flex;flex-direction:column;gap:14px;color:#f6ead6\">\n      <div style=\"font-family:'Caveat',cursive;font-size:38px;color:#b7d0f0;line-height:1\">Real life<\u002Fdiv>\n      <div style=\"font-family:'DM Serif Display',serif;font-size:34px;line-height:1.15;text-wrap:balance\">The biggest reason anyone in India moves is a wedding<\u002Fdiv>\n      <p style=\"margin:0;font-size:22px;line-height:1.45;text-wrap:pretty\">In much of north India a bride moves to her husband's village after marriage, usually a few villages over and rarely across a state line. The 2011 census counted about 200 million women who gave marriage as their reason for migrating: millions of moves, almost all of them short.<\u002Fp>\n    <\u002Fdiv>\n    <img src=\"https://commons.wikimedia.org/wiki/Special:FilePath/India%20(orthographic%20projection).svg?width=300\" alt=\"India locator\" style=\"position:absolute;top:36px;right:36px;width:150px;height:150px;border-radius:50%;background:#f6ead6;box-shadow:0 8px 24px rgba(0,0,0,.35)\">\n  <\u002Fdiv>\n  <div style=\"padding:70px 100px 60px 80px;display:flex;flex-direction:column;gap:26px;min-height:0\">\n    <div style=\"font-size:24px;letter-spacing:.22em;text-transform:uppercase;color:#c2641f;font-weight:700\">Law 1 of 9 · Short distance · India<\u002Fdiv>\n    <h2 style=\"margin:0;font-family:'DM Serif Display',serif;font-weight:400;font-size:60px;line-height:1.08;text-wrap:balance\">\"Most migrants move only a short distance.\"<\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:24px\">\n      <div style=\"display:flex;flex-direction:column;gap:4px;border-top:3px solid #c2641f;padding-top:14px\"><div style=\"font-family:'DM Serif Display',serif;font-size:58px;line-height:1\">454M<\u002Fdiv><div style=\"font-size:21px;color:#6b6580;line-height:1.3\">internal migrants counted in 2011, a third of the country<\u002Fdiv><\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:4px;border-top:3px solid #c2641f;padding-top:14px\"><div style=\"font-family:'DM Serif Display',serif;font-size:58px;line-height:1\">780+<\u002Fdiv><div style=\"font-size:21px;color:#6b6580;line-height:1.3\">districts, each about the size of a US county, with its own market town and hospital<\u002Fdiv><\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:4px;border-top:3px solid #c2641f;padding-top:14px\"><div style=\"font-family:'DM Serif Display',serif;font-size:58px;line-height:1\">22<\u002Fdiv><div style=\"font-size:21px;color:#6b6580;line-height:1.3\">official languages: crossing a state line often means a new language<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"position:relative;flex:1;min-height:0;background:#fff8ec;border:2px solid #e6d3b3;border-radius:8px;padding:36px 40px;display:flex;flex-direction:column;gap:24px\">\n      <div style=\"font-size:27px;font-weight:700\">Where did India's internal migrants move? <span style=\"font-weight:400;color:#6b6580\">(share of 454M)<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:20px\">\n        <sc-for list=\"{{ india }}\" as=\"row\" hint-placeholder-count=\"3\">\n          <div style=\"display:grid;grid-template-columns:330px 1fr 110px;gap:20px;align-items:center\">\n            <div style=\"font-size:25px;line-height:1.3\">{{ row.label }}<\u002Fdiv>\n            <div style=\"height:50px;background:#eddcbf;border-radius:4px;overflow:hidden\"><div style=\"height:100%;background:#e9a23b;width:{{ row.w }}%\"><\u002Fdiv><\u002Fdiv>\n            <div style=\"font-family:'DM Serif Display',serif;font-size:40px;text-align:right\">{{ row.value }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"margin-top:auto;font-size:20px;color:#6b6580\">Source: Census of India 2011, migration tables (D-series). Rounded.<\u002Fdiv>\n      <sc-if value=\"{{ hidden.l1 }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"position:absolute;inset:0;background:#262c66;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;color:#f6ead6;padding:50px;text-align:center\">\n          <div style=\"font-family:'Caveat',cursive;font-size:40px;color:#b7d0f0;line-height:1\">Predict first<\u002Fdiv>\n          <div style=\"font-family:'DM Serif Display',serif;font-size:40px;line-height:1.2;text-wrap:balance\">Of every 100 internal migrants in India, how many never left their district?<\u002Fdiv>\n          <button sc-camel-on-click=\"{{ reveal.l1 }}\" style=\"margin-top:6px;background:#e9a23b;color:#1d1a2b;border:0;border-radius:999px;padding:16px 40px;font-size:25px;font-weight:700\">Reveal data<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:auto 1fr 1fr;gap:24px;align-items:center;background:#262c66;color:#f6ead6;border-radius:8px;padding:18px 28px\">\n      <div style=\"font-family:'Caveat',cursive;font-size:32px;color:#f3c477;line-height:1\">Then / now<\u002Fdiv>\n      <div style=\"font-size:21px;line-height:1.4\"><strong style=\"color:#b7d0f0\">Britain, 1881.<\u002Fstrong> Ravenstein found most migrants had moved only to the county next door.<\u002Fdiv>\n      <div style=\"font-size:21px;line-height:1.4\"><strong style=\"color:#b7d0f0\">India, 2011.<\u002Fstrong> Six in ten never left their district; only 12% crossed a state line.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Law 2 · Distance decay\" data-screen-label=\"06\" data-speaker-notes=\"Syrians displaced since 2011. Germany is the outlier: intervening obstacles were lowered by the 2015 open-door policy. Lebanon is small and capacity-limited, which is why Türkiye, farther away, hosts more.\" style=\"position:relative;overflow:hidden;isolation:isolate;width:1920px;height:1080px;box-sizing:border-box;padding:70px 110px 60px;background:#262c66;color:#f6ead6;font-family:'Nunito Sans',sans-serif;display:flex;flex-direction:column;gap:30px\">\n  <div style=\"position:absolute;inset:0;z-index:-2;pointer-events:none;background:url(https://commons.wikimedia.org/wiki/Special:FilePath/An%20Aerial%20View%20of%20the%20Za%27atri%20Refugee%20Camp.jpg?width=1600) center/cover;opacity:.22;filter:grayscale(.5) contrast(1.1);mask-image:linear-gradient(180deg,rgba(0,0,0,1),rgba(0,0,0,.15) 70%);-webkit-mask-image:linear-gradient(180deg,rgba(0,0,0,1),rgba(0,0,0,.15) 70%)\"><\u002Fdiv>\n  <div style=\"position:absolute;inset:0;z-index:-1;pointer-events:none;background-image:url('data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%27200%27%20height%3D%27200%27%3E%3Cfilter%20id%3D%27n%27%3E%3CfeTurbulence%20type%3D%27fractalNoise%27%20baseFrequency%3D%27.9%27%20numOctaves%3D%272%27%20stitchTiles%3D%27stitch%27%2F%3E%3CfeColorMatrix%20values%3D%270%200%200%200%200%200%200%200%200%200%200%200%200%200%200%200%200%200%20.55%200%27%2F%3E%3C%2Ffilter%3E%3Crect%20width%3D%27200%27%20height%3D%27200%27%20filter%3D%27url(%23n)%27%2F%3E%3C%2Fsvg%3E');background-size:200px 200px;opacity:.4;mix-blend-mode:multiply\"><\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:1fr 150px;gap:40px;align-items:start\">\n    <div style=\"display:flex;flex-direction:column;gap:14px\">\n      <div style=\"font-size:24px;letter-spacing:.22em;text-transform:uppercase;color:#e9a23b;font-weight:700\">Law 2 of 9 · Distance decay · Syria<\u002Fdiv>\n      <h2 style=\"margin:0;font-family:'DM Serif Display',serif;font-weight:400;font-size:60px;line-height:1.08;text-wrap:balance\">\"The farther the destination, the fewer people go there.\"<\u002Fh2>\n    <\u002Fdiv>\n    <img src=\"https://commons.wikimedia.org/wiki/Special:FilePath/Syria%20(orthographic%20projection).svg?width=300\" alt=\"Syria locator\" style=\"width:150px;height:150px;border-radius:50%;background:#f6ead6;box-shadow:0 8px 24px rgba(0,0,0,.35)\">\n  <\u002Fdiv>\n  <div style=\"display:flex;gap:60px\">\n    <div style=\"display:flex;align-items:baseline;gap:14px\"><span style=\"font-family:'DM Serif Display',serif;font-size:56px;line-height:1;color:#f3c477\">22M<\u002Fspan><span style=\"font-size:21px;color:#b7d0f0;max-width:220px;line-height:1.3\">people in Syria when war began, 2011<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex;align-items:baseline;gap:14px\"><span style=\"font-family:'DM Serif Display',serif;font-size:56px;line-height:1;color:#f3c477\">1 in 2<\u002Fspan><span style=\"font-size:21px;color:#b7d0f0;max-width:240px;line-height:1.3\">forced from home: 6.8M inside Syria, 6M+ abroad<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex;align-items:baseline;gap:14px\"><span style=\"font-family:'DM Serif Display',serif;font-size:56px;line-height:1;color:#f3c477\">80,000<\u002Fspan><span style=\"font-size:21px;color:#b7d0f0;max-width:240px;line-height:1.3\">people in Za'atari camp, Jordan, within two years<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:1fr 560px;gap:40px;flex:1;min-height:0\">\n    <div style=\"position:relative;background:#fff8ec;color:#1d1a2b;border-radius:8px;padding:36px 40px;display:flex;flex-direction:column;gap:20px\">\n      <div style=\"font-size:27px;font-weight:700\">Syrians hosted, sorted by distance from Damascus<\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:14px\">\n        <sc-for list=\"{{ syria }}\" as=\"row\" hint-placeholder-count=\"7\">\n          <div style=\"display:grid;grid-template-columns:190px 120px 1fr 110px;gap:18px;align-items:center\">\n            <div style=\"font-size:24px;font-weight:600\">{{ row.label }}<\u002Fdiv>\n            <div style=\"font-size:21px;color:#6b6580\">{{ row.dist }}<\u002Fdiv>\n            <div style=\"height:36px;background:#eddcbf;border-radius:4px;overflow:hidden\"><div style=\"height:100%;background:{{ row.color }};width:{{ row.w }}%\"><\u002Fdiv><\u002Fdiv>\n            <div style=\"font-family:'DM Serif Display',serif;font-size:30px;text-align:right\">{{ row.value }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"margin-top:auto;font-size:19px;color:#6b6580\">Source: UNHCR (registered refugees) and national statistics, 2023. Approximate; straight-line distances.<\u002Fdiv>\n      <sc-if value=\"{{ hidden.l2 }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"position:absolute;inset:0;background:#3b4a8c;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;color:#f6ead6;padding:50px;text-align:center\">\n          <div style=\"font-family:'Caveat',cursive;font-size:40px;color:#b7d0f0;line-height:1\">Predict first<\u002Fdiv>\n          <div style=\"font-family:'DM Serif Display',serif;font-size:40px;line-height:1.2;text-wrap:balance\">Rank from most to fewest Syrians hosted: Türkiye, Germany, Lebanon, Sweden, United States.<\u002Fdiv>\n          <button sc-camel-on-click=\"{{ reveal.l2 }}\" style=\"margin-top:6px;background:#e9a23b;color:#1d1a2b;border:0;border-radius:999px;padding:16px 40px;font-size:25px;font-weight:700\">Reveal data<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:16px;border-left:2px solid rgba(214,190,120,.4);padding-left:36px\">\n      <div style=\"font-family:'Caveat',cursive;font-size:38px;color:#b7d0f0;line-height:1\">Real life<\u002Fdiv>\n      <div style=\"font-family:'DM Serif Display',serif;font-size:34px;line-height:1.15;text-wrap:balance\">The Balkan route, summer 2015<\u002Fdiv>\n      <p style=\"margin:0;font-size:22px;line-height:1.45;text-wrap:pretty\">About a million people crossed the Aegean from Türkiye to Greece in rubber boats, then walked and rode north through North Macedonia, Serbia, Hungary and Austria. When Germany announced it would not turn Syrians back, Munich's main station became the finish line: up to 13,000 arrivals in a single day that September.<\u002Fp>\n      <div style=\"display:flex;flex-direction:column;gap:10px;font-size:21px;line-height:1.35\">\n        <div style=\"display:grid;grid-template-columns:14px 1fr;gap:14px\"><span style=\"width:10px;height:10px;border-radius:50%;background:#e9a23b;margin-top:9px\"><\u002Fspan><span>A policy decision, not distance, made Germany the outlier.<\u002Fspan><\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:14px 1fr;gap:14px\"><span style=\"width:10px;height:10px;border-radius:50%;background:#e9a23b;margin-top:9px\"><\u002Fspan><span>Hungary built a border fence; the route shifted west within weeks. Ravenstein would call the fence an intervening obstacle.<\u002Fspan><\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:14px 1fr;gap:14px\"><span style=\"width:10px;height:10px;border-radius:50%;background:#e9a23b;margin-top:9px\"><\u002Fspan><span>Türkiye hosts more refugees than any other country on earth.<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"margin-top:auto;font-size:19px;opacity:.6\">Background: Za'atari camp, Jordan. US State Dept via Wikimedia Commons, public domain.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Law 3 · Urban areas\" data-screen-label=\"07\" data-speaker-notes=\"China's 2020 census counted 376 million people living away from their hukou registration, about 1 in 4. Chunyun, the Lunar New Year rush home, is the flow in reverse. Then/now: 1881 London had a third of residents born elsewhere.\" style=\"position:relative;overflow:hidden;isolation:isolate;width:1920px;height:1080px;box-sizing:border-box;padding:70px 110px 60px;background:#f6ead6;color:#1d1a2b;font-family:'Nunito Sans',sans-serif;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto 1fr;gap:34px 60px\">\n  <div style=\"position:absolute;inset:0;z-index:-2;pointer-events:none;background:url(https://commons.wikimedia.org/wiki/Special:FilePath/Shenzhen%20Skyline%20from%20Nanshan.jpg?width=1600) center/cover;opacity:.14;filter:grayscale(.4) sepia(.3);mask-image:linear-gradient(0deg,rgba(0,0,0,1),rgba(0,0,0,0) 55%);-webkit-mask-image:linear-gradient(0deg,rgba(0,0,0,1),rgba(0,0,0,0) 55%)\"><\u002Fdiv>\n  <div style=\"position:absolute;inset:0;z-index:-1;pointer-events:none;background-image:url('data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%27200%27%20height%3D%27200%27%3E%3Cfilter%20id%3D%27n%27%3E%3CfeTurbulence%20type%3D%27fractalNoise%27%20baseFrequency%3D%27.9%27%20numOctaves%3D%272%27%20stitchTiles%3D%27stitch%27%2F%3E%3CfeColorMatrix%20values%3D%270%200%200%200%200%200%200%200%200%200%200%200%200%200%200%200%200%200%20.55%200%27%2F%3E%3C%2Ffilter%3E%3Crect%20width%3D%27200%27%20height%3D%27200%27%20filter%3D%27url(%23n)%27%2F%3E%3C%2Fsvg%3E');background-size:200px 200px;opacity:.5;mix-blend-mode:multiply\"><\u002Fdiv>\n  <div style=\"grid-column:1/-1;display:grid;grid-template-columns:1fr 720px;gap:60px;align-items:end\">\n    <div style=\"display:flex;flex-direction:column;gap:14px\">\n      <div style=\"font-size:24px;letter-spacing:.22em;text-transform:uppercase;color:#c2641f;font-weight:700\">Law 3 of 9 · Urban areas · China<\u002Fdiv>\n      <h2 style=\"margin:0;font-family:'DM Serif Display',serif;font-weight:400;font-size:56px;line-height:1.08;text-wrap:balance\">\"Long-distance migrants head for the great centers of commerce and industry.\"<\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;border:2px solid #262c66;border-radius:8px;overflow:hidden\">\n      <div style=\"background:#262c66;color:#f6ead6;padding:22px 26px;display:flex;flex-direction:column;gap:8px\"><div style=\"font-family:'Caveat',cursive;font-size:30px;color:#f3c477;line-height:1\">Then · London 1881<\u002Fdiv><div style=\"font-size:21px;line-height:1.4\">More than a third of Londoners had been born outside the city. Ravenstein called such places \"centres of absorption.\"<\u002Fdiv><\u002Fdiv>\n      <div style=\"padding:22px 26px;display:flex;flex-direction:column;gap:8px;background:#fff8ec\"><div style=\"font-family:'Caveat',cursive;font-size:30px;color:#c2641f;line-height:1\">Now · Shenzhen 2020<\u002Fdiv><div style=\"font-size:21px;line-height:1.4\">Two-thirds of residents are registered somewhere else. In 1980 the city was a fishing town of 30,000; today it is 17.5 million.<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"position:relative;background:#fff8ec;border:2px solid #e6d3b3;border-radius:8px;padding:36px 40px;display:flex;flex-direction:column;gap:22px;min-height:0\">\n    <div style=\"font-size:26px;font-weight:700\">Residents who are migrants (living away from their registered hometown)<\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:18px\">\n      <sc-for list=\"{{ china }}\" as=\"row\" hint-placeholder-count=\"5\">\n        <div style=\"display:grid;grid-template-columns:200px 1fr 100px;gap:18px;align-items:center\">\n          <div style=\"font-size:25px;font-weight:{{ row.weight }}\">{{ row.label }}<\u002Fdiv>\n          <div style=\"height:42px;background:#eddcbf;border-radius:4px;overflow:hidden\"><div style=\"height:100%;background:{{ row.color }};width:{{ row.w }}%\"><\u002Fdiv><\u002Fdiv>\n          <div style=\"font-family:'DM Serif Display',serif;font-size:34px;text-align:right\">{{ row.value }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"margin-top:auto;font-size:19px;color:#6b6580\">Source: China Seventh National Population Census (2020), municipal bulletins. Rounded.<\u002Fdiv>\n    <sc-if value=\"{{ hidden.l3 }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"position:absolute;inset:0;background:#262c66;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;color:#f6ead6;padding:50px;text-align:center\">\n        <div style=\"font-family:'Caveat',cursive;font-size:40px;color:#b7d0f0;line-height:1\">Predict first<\u002Fdiv>\n        <div style=\"font-family:'DM Serif Display',serif;font-size:40px;line-height:1.2;text-wrap:balance\">In China's biggest cities, what percent of residents were born somewhere else?<\u002Fdiv>\n        <button sc-camel-on-click=\"{{ reveal.l3 }}\" style=\"margin-top:6px;background:#e9a23b;color:#1d1a2b;border:0;border-radius:999px;padding:16px 40px;font-size:25px;font-weight:700\">Reveal data<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:1fr 250px;gap:30px;min-height:0\">\n    <div style=\"display:flex;flex-direction:column;gap:14px\">\n      <div style=\"font-family:'Caveat',cursive;font-size:38px;color:#c2641f;line-height:1\">Real life<\u002Fdiv>\n      <div style=\"font-family:'DM Serif Display',serif;font-size:32px;line-height:1.15;text-wrap:balance\">Chunyun: the largest human migration on earth runs in reverse<\u002Fdiv>\n      <p style=\"margin:0;font-size:22px;line-height:1.45;text-wrap:pretty\">Every January the flow flips. During chunyun, the 40 days around Lunar New Year, China records billions of passenger trips as factory and construction workers head home to villages they left years ago, then pour back into the coastal cities when the holiday ends.<\u002Fp>\n      <div style=\"display:flex;flex-direction:column;gap:8px;font-size:21px;line-height:1.35;color:#3d3950\">\n        <div style=\"display:grid;grid-template-columns:14px 1fr;gap:14px\"><span style=\"width:10px;height:10px;border-radius:50%;background:#c2641f;margin-top:9px\"><\u002Fspan><span>The hukou system ties schooling and healthcare to a registered hometown, not to where a person actually lives.<\u002Fspan><\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:14px 1fr;gap:14px\"><span style=\"width:10px;height:10px;border-radius:50%;background:#c2641f;margin-top:9px\"><\u002Fspan><span>376 million Chinese, about 1 in 4, live away from their hukou.<\u002Fspan><\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:14px 1fr;gap:14px\"><span style=\"width:10px;height:10px;border-radius:50%;background:#c2641f;margin-top:9px\"><\u002Fspan><span>Many \"left-behind children\" see their parents only during this window.<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:14px;align-items:center\">\n      <img src=\"https://commons.wikimedia.org/wiki/Special:FilePath/China%20(orthographic%20projection).svg?width=300\" alt=\"China locator\" style=\"width:150px;height:150px;border-radius:50%;background:#fff8ec;box-shadow:0 8px 24px rgba(0,0,0,.2)\">\n      <div style=\"width:250px;height:250px\"><image-slot id=\"img-l3\" shape=\"rounded\" radius=\"6\" src=\"https://commons.wikimedia.org/wiki/Special:FilePath/Shenzhen%20Skyline%20from%20Nanshan.jpg?width=1600\" credit=\"Simbaxu via Wikimedia Commons, CC BY-SA 4.0\" placeholder=\"Drop a photo: Shenzhen skyline\"><\u002Fimage-slot><\u002Fdiv>\n      <div style=\"font-size:19px;color:#6b6580;text-align:center\">Shenzhen, a city built almost entirely by migrants.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Law 4 · Gravity model\" data-screen-label=\"08\" data-speaker-notes=\"Interactive. Pick an origin; bars show predicted interaction = (Pop A × Pop B) / distance². Have students compute one pair by hand on the worksheet. Real story: pau de arara trucks from the Northeast.\" style=\"position:relative;overflow:hidden;isolation:isolate;width:1920px;height:1080px;box-sizing:border-box;padding:70px 110px 60px;background:#262c66;color:#f6ead6;font-family:'Nunito Sans',sans-serif;display:grid;grid-template-columns:1fr 520px;gap:60px\">\n  <div style=\"position:absolute;inset:0;z-index:-2;pointer-events:none;background:url(https://commons.wikimedia.org/wiki/Special:FilePath/Brasilia%20aerea%20eixo%20monumental.jpg?width=1600) center/cover;opacity:.16;filter:grayscale(.6);mask-image:linear-gradient(270deg,rgba(0,0,0,1),rgba(0,0,0,0) 60%);-webkit-mask-image:linear-gradient(270deg,rgba(0,0,0,1),rgba(0,0,0,0) 60%)\"><\u002Fdiv>\n  <div style=\"position:absolute;inset:0;z-index:-1;pointer-events:none;background-image:url('data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%27200%27%20height%3D%27200%27%3E%3Cfilter%20id%3D%27n%27%3E%3CfeTurbulence%20type%3D%27fractalNoise%27%20baseFrequency%3D%27.9%27%20numOctaves%3D%272%27%20stitchTiles%3D%27stitch%27%2F%3E%3CfeColorMatrix%20values%3D%270%200%200%200%200%200%200%200%200%200%200%200%200%200%200%200%200%200%20.55%200%27%2F%3E%3C%2Ffilter%3E%3Crect%20width%3D%27200%27%20height%3D%27200%27%20filter%3D%27url(%23n)%27%2F%3E%3C%2Fsvg%3E');background-size:200px 200px;opacity:.4;mix-blend-mode:multiply\"><\u002Fdiv>\n  <div style=\"display:flex;flex-direction:column;gap:26px;min-height:0\">\n    <div style=\"font-size:24px;letter-spacing:.22em;text-transform:uppercase;color:#e9a23b;font-weight:700\">Law 4 of 9 · Gravity model · Brazil<\u002Fdiv>\n    <h2 style=\"margin:0;font-family:'DM Serif Display',serif;font-weight:400;font-size:56px;line-height:1.08;text-wrap:balance\">Bigger places attract more; farther places attract less.<\u002Fh2>\n    <div style=\"display:flex;align-items:center;gap:30px;flex-wrap:wrap\">\n      <div style=\"font-family:'DM Serif Display',serif;font-size:34px;color:#f3c477\">Interaction = (Pop<sub>A<\u002Fsub> × Pop<sub>B<\u002Fsub>) ÷ Distance²<\u002Fdiv>\n      <div style=\"display:flex;gap:10px;align-items:center;margin-left:auto\"><span style=\"font-size:21px;color:#b7d0f0\">Origin:<\u002Fspan>\n        <sc-for list=\"{{ originButtons }}\" as=\"b\" hint-placeholder-count=\"3\"><button sc-camel-on-click=\"{{ b.onClick }}\" style=\"border:2px solid #e9a23b;border-radius:999px;padding:8px 20px;font-size:21px;font-weight:700;background:{{ b.bg }};color:{{ b.fg }}\">{{ b.label }}<\u002Fbutton><\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex:1;min-height:0;background:#fff8ec;color:#1d1a2b;border-radius:8px;padding:34px 40px;display:flex;flex-direction:column;gap:20px\">\n      <div style=\"font-size:26px;font-weight:700\">Predicted interaction from <span style=\"color:#c2641f\">{{ originName }}<\u002Fspan><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:210px 110px 120px 1fr 100px;gap:16px;font-size:19px;letter-spacing:.12em;text-transform:uppercase;color:#6b6580;font-weight:700;padding-bottom:8px;border-bottom:2px solid #e6d3b3\">\n        <div>Destination<\u002Fdiv><div>Pop (M)<\u002Fdiv><div>Distance<\u002Fdiv><div>Predicted interaction<\u002Fdiv><div style=\"text-align:right\">Index<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:16px\">\n        <sc-for list=\"{{ gravityRows }}\" as=\"row\" hint-placeholder-count=\"5\">\n          <div style=\"display:grid;grid-template-columns:210px 110px 120px 1fr 100px;gap:16px;align-items:center\">\n            <div style=\"font-size:25px;font-weight:600\">{{ row.city }}<\u002Fdiv>\n            <div style=\"font-size:23px\">{{ row.pop }}<\u002Fdiv>\n            <div style=\"font-size:23px\">{{ row.dist }} km<\u002Fdiv>\n            <div style=\"height:36px;background:#eddcbf;border-radius:4px;overflow:hidden\"><div style=\"height:100%;background:#e9a23b;width:{{ row.w }}%;transition:width .4s\"><\u002Fdiv><\u002Fdiv>\n            <div style=\"font-family:'DM Serif Display',serif;font-size:32px;text-align:right\">{{ row.index }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"margin-top:auto;font-size:19px;color:#6b6580\">Index = (Pop A × Pop B) ÷ (distance in 100s of km)², populations in millions (IBGE 2022, municipality). Straight-line distances, rounded.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:flex;flex-direction:column;gap:18px;min-height:0\">\n    <div style=\"display:flex;justify-content:space-between;align-items:center\">\n      <div style=\"display:flex;flex-direction:column;gap:4px\"><div style=\"font-family:'DM Serif Display',serif;font-size:52px;line-height:1;color:#f3c477\">215M<\u002Fdiv><div style=\"font-size:20px;color:#b7d0f0\">people, most on the coast<\u002Fdiv><\u002Fdiv>\n      <img src=\"https://commons.wikimedia.org/wiki/Special:FilePath/Brazil%20(orthographic%20projection).svg?width=300\" alt=\"Brazil locator\" style=\"width:150px;height:150px;border-radius:50%;background:#f6ead6;box-shadow:0 8px 24px rgba(0,0,0,.35)\">\n    <\u002Fdiv>\n    <p style=\"margin:0;font-size:21px;line-height:1.45;text-wrap:pretty;color:#e6dcc8\">Brazil covers as much land as the continental United States. São Paulo's metro area, 22 million, is the largest city in the Americas. Brasília did not exist until 1960, when it was built from scratch on the empty central plateau: an attempt to bend the gravity model by creating a new big place.<\u002Fp>\n    <div style=\"height:200px\"><image-slot id=\"img-l4\" shape=\"rounded\" radius=\"6\" src=\"https://commons.wikimedia.org/wiki/Special:FilePath/Brasilia%20aerea%20eixo%20monumental.jpg?width=1600\" credit=\"Wikimedia Commons, CC BY\" placeholder=\"Drop a photo: Brasília's planned axis\"><\u002Fimage-slot><\u002Fdiv>\n    <div style=\"border-top:2px solid rgba(214,190,120,.4);padding-top:18px;display:flex;flex-direction:column;gap:10px\">\n      <div style=\"font-family:'Caveat',cursive;font-size:34px;color:#b7d0f0;line-height:1\">Real life · pau de arara<\u002Fdiv>\n      <p style=\"margin:0;font-size:21px;line-height:1.45;text-wrap:pretty\">From the 1950s to the 1980s, millions of Nordestinos fleeing drought rode 2,000 km south to São Paulo in open trucks fitted with wooden benches, nicknamed \"parrot's perch.\" Distance was enormous, but the pull of Brazil's industrial heart was greater. São Paulo's forró music and Northeastern food trace to this flow.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Law 5 · Step migration\" data-screen-label=\"09\" data-speaker-notes=\"Illustrative pathway, not a single dataset. Click each step. Ask students whether the person is 'one migrant' or 'three migrations'. Matatus lower the cost of each step; M-Pesa keeps the ladder connected.\" style=\"position:relative;overflow:hidden;isolation:isolate;width:1920px;height:1080px;box-sizing:border-box;padding:70px 110px 60px;background:#f6ead6;color:#1d1a2b;font-family:'Nunito Sans',sans-serif;display:flex;flex-direction:column;gap:30px\">\n  <div style=\"position:absolute;inset:0;z-index:-2;pointer-events:none;background:url(https://commons.wikimedia.org/wiki/Special:FilePath/Nairobi%20skyline%20from%20Uhuru%20Park.jpg?width=1600) center/cover;opacity:.14;filter:grayscale(.4) sepia(.3);mask-image:linear-gradient(180deg,rgba(0,0,0,1),rgba(0,0,0,0) 50%);-webkit-mask-image:linear-gradient(180deg,rgba(0,0,0,1),rgba(0,0,0,0) 50%)\"><\u002Fdiv>\n  <div style=\"position:absolute;inset:0;z-index:-1;pointer-events:none;background-image:url('data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%27200%27%20height%3D%27200%27%3E%3Cfilter%20id%3D%27n%27%3E%3CfeTurbulence%20type%3D%27fractalNoise%27%20baseFrequency%3D%27.9%27%20numOctaves%3D%272%27%20stitchTiles%3D%27stitch%27%2F%3E%3CfeColorMatrix%20values%3D%270%200%200%200%200%200%200%200%200%200%200%200%200%200%200%200%200%200%20.55%200%27%2F%3E%3C%2Ffilter%3E%3Crect%20width%3D%27200%27%20height%3D%27200%27%20filter%3D%27url(%23n)%27%2F%3E%3C%2Fsvg%3E');background-size:200px 200px;opacity:.5;mix-blend-mode:multiply\"><\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:1fr auto;gap:40px;align-items:start\">\n    <div style=\"display:flex;flex-direction:column;gap:14px\">\n      <div style=\"font-size:24px;letter-spacing:.22em;text-transform:uppercase;color:#c2641f;font-weight:700\">Law 5 of 9 · Step migration · Kenya<\u002Fdiv>\n      <h2 style=\"margin:0;font-family:'DM Serif Display',serif;font-weight:400;font-size:56px;line-height:1.08;text-wrap:balance\">\"Migration proceeds step by step\": village to town to city.<\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:40px;align-items:center\">\n      <div style=\"display:flex;flex-direction:column;gap:2px\"><div style=\"font-family:'DM Serif Display',serif;font-size:50px;line-height:1\">55M<\u002Fdiv><div style=\"font-size:19px;color:#6b6580\">people, median age 20<\u002Fdiv><\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:2px\"><div style=\"font-family:'DM Serif Display',serif;font-size:50px;line-height:1\">+4%<\u002Fdiv><div style=\"font-size:19px;color:#6b6580\">Nairobi growth per year<\u002Fdiv><\u002Fdiv>\n      <img src=\"https://commons.wikimedia.org/wiki/Special:FilePath/Kenya%20(orthographic%20projection).svg?width=300\" alt=\"Kenya locator\" style=\"width:140px;height:140px;border-radius:50%;background:#fff8ec;box-shadow:0 8px 24px rgba(0,0,0,.2)\">\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:16px;align-items:end;height:330px\">\n    <sc-for list=\"{{ steps }}\" as=\"s\" hint-placeholder-count=\"4\">\n      <button sc-camel-on-click=\"{{ s.onClick }}\" style=\"display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:flex-end;border:2px solid #262c66;border-radius:8px;padding:20px 12px;background:{{ s.bg }};color:{{ s.fg }};height:{{ s.h }}px;transition:all .25s\">\n        <div style=\"font-size:19px;letter-spacing:.14em;text-transform:uppercase;opacity:.8\">Step {{ s.n }}<\u002Fdiv>\n        <div style=\"font-family:'DM Serif Display',serif;font-size:30px;line-height:1.1;text-align:center\">{{ s.place }}<\u002Fdiv>\n        <div style=\"font-size:20px;opacity:.85;text-align:center\">{{ s.size }}<\u002Fdiv>\n      <\u002Fbutton>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:40px;flex:1;min-height:0\">\n    <div style=\"background:#262c66;color:#f6ead6;border-radius:8px;padding:30px 36px;display:flex;flex-direction:column;gap:12px\">\n      <div style=\"font-size:20px;letter-spacing:.14em;text-transform:uppercase;color:#e9a23b;font-weight:700\">Selected step<\u002Fdiv>\n      <div style=\"font-family:'DM Serif Display',serif;font-size:32px;color:#f3c477;line-height:1.1\">{{ stepTitle }}<\u002Fdiv>\n      <p style=\"margin:0;font-size:22px;line-height:1.45;text-wrap:pretty\">{{ stepBody }}<\u002Fp>\n      <div style=\"margin-top:auto;font-size:18px;opacity:.6\">Composite pathway based on KNBS 2019 census populations; individual reasons are illustrative.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:12px\">\n      <div style=\"font-family:'Caveat',cursive;font-size:36px;color:#c2641f;line-height:1\">Real life · matatus and M-Pesa<\u002Fdiv>\n      <p style=\"margin:0;font-size:22px;line-height:1.45;text-wrap:pretty\">Kenya's minibuses, the matatus, make each short hop cheap and frequent. M-Pesa, the mobile-money system launched in 2007, lets a migrant send money home from any phone in seconds. Economists Suri and Jack found it lifted about 2% of Kenyan households out of poverty, largely by making it easier to send one member to the city and stay connected. Over 90% of Kenyan adults use mobile money; remittances flow back down the same ladder the migrant climbed.<\u002Fp>\n      <div style=\"font-size:19px;color:#6b6580;margin-top:auto\">Suri &amp; Jack, <em>Science<\u002Fem> (2016); Central Bank of Kenya. Background: Nairobi from Uhuru Park, Wikimedia Commons, CC BY-SA 4.0.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Law 6 · Counter migration\" data-screen-label=\"10\" data-speaker-notes=\"Pew Research Center, 2015. Between 2009 and 2014 more Mexicans left the US for Mexico than arrived. Net: +2.27M (95–00), −0.02M (05–10), −0.13M (09–14). Drivers: 2008 recession, enforcement, family reunification.\" style=\"position:relative;overflow:hidden;isolation:isolate;width:1920px;height:1080px;box-sizing:border-box;font-family:'Nunito Sans',sans-serif;display:grid;grid-template-columns:860px 1fr\">\n  <div style=\"position:relative;box-sizing:border-box;background:#262c66;color:#f6ead6;padding:60px 70px 50px 110px;overflow:hidden;isolation:isolate\">\n    <div style=\"position:absolute;inset:0;z-index:-2;pointer-events:none;background:url(https://commons.wikimedia.org/wiki/Special:FilePath/Border%20USA%20Mexico.jpg?width=1600) center/cover;opacity:.18;filter:grayscale(.6)\"><\u002Fdiv>\n    <div style=\"position:absolute;inset:0;z-index:-1;pointer-events:none;background-image:url('data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%27200%27%20height%3D%27200%27%3E%3Cfilter%20id%3D%27n%27%3E%3CfeTurbulence%20type%3D%27fractalNoise%27%20baseFrequency%3D%27.9%27%20numOctaves%3D%272%27%20stitchTiles%3D%27stitch%27%2F%3E%3CfeColorMatrix%20values%3D%270%200%200%200%200%200%200%200%200%200%200%200%200%200%200%200%200%200%20.55%200%27%2F%3E%3C%2Ffilter%3E%3Crect%20width%3D%27200%27%20height%3D%27200%27%20filter%3D%27url(%23n)%27%2F%3E%3C%2Fsvg%3E');background-size:200px 200px;opacity:.4;mix-blend-mode:multiply\"><\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:18px;height:100%;min-height:0\">\n      <div style=\"font-size:24px;letter-spacing:.22em;text-transform:uppercase;color:#e9a23b;font-weight:700\">Law 6 of 9 · Counter migration · Mexico ↔ US<\u002Fdiv>\n      <h2 style=\"margin:0;font-family:'DM Serif Display',serif;font-weight:400;font-size:46px;line-height:1.08;text-wrap:balance\">\"Each main current of migration produces a compensating counter-current.\"<\u002Fh2>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:20px 30px;margin-top:8px\">\n        <div style=\"display:flex;flex-direction:column;gap:2px\"><div style=\"font-family:'DM Serif Display',serif;font-size:50px;line-height:1;color:#f3c477\">11M<\u002Fdiv><div style=\"font-size:20px;color:#b7d0f0;line-height:1.3\">Mexican-born people live in the US, the largest single-country group on earth<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:2px\"><div style=\"font-family:'DM Serif Display',serif;font-size:50px;line-height:1;color:#f3c477\">$60B<\u002Fdiv><div style=\"font-size:20px;color:#b7d0f0;line-height:1.3\">remittances to Mexico in 2023, more than oil exports<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:2px\"><div style=\"font-family:'DM Serif Display',serif;font-size:50px;line-height:1;color:#f3c477\">3,145 km<\u002Fdiv><div style=\"font-size:20px;color:#b7d0f0;line-height:1.3\">of border<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:2px\"><div style=\"font-family:'DM Serif Display',serif;font-size:50px;line-height:1;color:#f3c477\">500,000<\u002Fdiv><div style=\"font-size:20px;color:#b7d0f0;line-height:1.3\">US-born children now living in Mexico<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border-top:2px solid rgba(214,190,120,.4);padding-top:20px;display:flex;flex-direction:column;gap:10px\">\n        <div style=\"font-family:'Caveat',cursive;font-size:36px;color:#b7d0f0;line-height:1\">Real life · \"los invisibles\"<\u002Fdiv>\n        <p style=\"margin:0;font-size:21px;line-height:1.45;text-wrap:pretty\">Roughly half a million US-born children now live in Mexico, having moved with parents who returned by choice or were deported. Many arrive speaking better English than Spanish and hold US passports. Researchers call them \"los invisibles\" because neither country's school system was built for them. Family reunification was the top reason returnees gave for going back; the 2008 recession erased the construction jobs that had pulled many north.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end;gap:20px\">\n        <div style=\"font-size:18px;opacity:.6;max-width:520px\">Pew Research Center; Banco de México; Mexico Intercensal Survey 2015. Background: US–Mexico border, Sgt. Gordon Hyde, public domain.<\u002Fdiv>\n        <img src=\"https://commons.wikimedia.org/wiki/Special:FilePath/Mexico%20(orthographic%20projection).svg?width=300\" alt=\"Mexico locator\" style=\"width:120px;height:120px;border-radius:50%;background:#f6ead6;box-shadow:0 8px 24px rgba(0,0,0,.35)\">\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"position:relative;box-sizing:border-box;background:#f6ead6;color:#1d1a2b;padding:70px 110px 60px 70px;overflow:hidden;isolation:isolate\">\n    <div style=\"position:absolute;inset:0;z-index:-1;pointer-events:none;background-image:url('data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%27200%27%20height%3D%27200%27%3E%3Cfilter%20id%3D%27n%27%3E%3CfeTurbulence%20type%3D%27fractalNoise%27%20baseFrequency%3D%27.9%27%20numOctaves%3D%272%27%20stitchTiles%3D%27stitch%27%2F%3E%3CfeColorMatrix%20values%3D%270%200%200%200%200%200%200%200%200%200%200%200%200%200%200%200%200%200%20.55%200%27%2F%3E%3C%2Ffilter%3E%3Crect%20width%3D%27200%27%20height%3D%27200%27%20filter%3D%27url(%23n)%27%2F%3E%3C%2Fsvg%3E');background-size:200px 200px;opacity:.5;mix-blend-mode:multiply\"><\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:24px;height:100%\">\n      <div style=\"display:flex;flex-direction:column;gap:14px\">\n        <div style=\"font-size:26px;font-weight:700\">Migrants moving between Mexico and the US (millions)<\u002Fdiv>\n        <div style=\"display:flex;gap:24px;font-size:21px\"><span style=\"display:flex;align-items:center;gap:8px\"><i style=\"width:18px;height:18px;background:#e9a23b;border-radius:3px\"><\u002Fi>Mexico → US<\u002Fspan><span style=\"display:flex;align-items:center;gap:8px\"><i style=\"width:18px;height:18px;background:#3b4a8c;border-radius:3px\"><\u002Fi>US → Mexico<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"position:relative;flex:1;min-height:0;display:flex;flex-direction:column;gap:34px;justify-content:center\">\n        <sc-for list=\"{{ mexico }}\" as=\"row\" hint-placeholder-count=\"3\">\n          <div style=\"display:flex;flex-direction:column;gap:10px\">\n            <div style=\"font-family:'DM Serif Display',serif;font-size:32px\">{{ row.period }}<\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:1fr 110px;gap:14px;align-items:center\"><div style=\"height:40px;background:#eddcbf;border-radius:4px;overflow:hidden\"><div style=\"height:100%;background:#e9a23b;width:{{ row.wUs }}%\"><\u002Fdiv><\u002Fdiv><div style=\"font-size:26px;font-weight:700\">{{ row.toUs }}<\u002Fdiv><\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:1fr 110px;gap:14px;align-items:center\"><div style=\"height:40px;background:#eddcbf;border-radius:4px;overflow:hidden\"><div style=\"height:100%;background:#3b4a8c;width:{{ row.wMx }}%\"><\u002Fdiv><\u002Fdiv><div style=\"font-size:26px;font-weight:700\">{{ row.toMx }}<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <sc-if value=\"{{ hidden.l6 }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"position:absolute;inset:-20px;background:#fff8ec;border:2px solid #e6d3b3;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:50px;text-align:center\">\n            <div style=\"font-family:'Caveat',cursive;font-size:40px;color:#c2641f;line-height:1\">Predict first<\u002Fdiv>\n            <div style=\"font-family:'DM Serif Display',serif;font-size:40px;line-height:1.2;text-wrap:balance\">2009–2014: did more people move from Mexico to the US, or from the US to Mexico?<\u002Fdiv>\n            <button sc-camel-on-click=\"{{ reveal.l6 }}\" style=\"margin-top:6px;background:#262c66;color:#f6ead6;border:0;border-radius:999px;padding:16px 40px;font-size:25px;font-weight:700\">Reveal data<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <div style=\"font-size:19px;color:#6b6580\">Source: Pew Research Center, \"More Mexicans Leaving Than Coming to the U.S.\" (2015), using Mexican and US census data.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Law 7 · Rural to urban\" data-screen-label=\"11\" data-speaker-notes=\"Lagos grew from a city of 300,000 to a megacity in 75 years. Nigeria crossed 50% urban around 2019. Then/now: England became the first majority-urban country in 1851, the world Ravenstein grew up in.\" style=\"position:relative;overflow:hidden;isolation:isolate;width:1920px;height:1080px;box-sizing:border-box;background:#f6ead6;color:#1d1a2b;font-family:'Nunito Sans',sans-serif;display:grid;grid-template-rows:400px 1fr\">\n  <div style=\"position:absolute;inset:0;z-index:-1;pointer-events:none;background-image:url('data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%27200%27%20height%3D%27200%27%3E%3Cfilter%20id%3D%27n%27%3E%3CfeTurbulence%20type%3D%27fractalNoise%27%20baseFrequency%3D%27.9%27%20numOctaves%3D%272%27%20stitchTiles%3D%27stitch%27%2F%3E%3CfeColorMatrix%20values%3D%270%200%200%200%200%200%200%200%200%200%200%200%200%200%200%200%200%200%20.55%200%27%2F%3E%3C%2Ffilter%3E%3Crect%20width%3D%27200%27%20height%3D%27200%27%20filter%3D%27url(%23n)%27%2F%3E%3C%2Fsvg%3E');background-size:200px 200px;opacity:.5;mix-blend-mode:multiply\"><\u002Fdiv>\n  <div style=\"position:relative;height:400px;overflow:hidden\">\n    <image-slot id=\"img-l7\" shape=\"rect\" src=\"https://commons.wikimedia.org/wiki/Special:FilePath/Aerial%20view%20of%20Makoko%20Slum%20in%20Lagos%20Nigeria.png?width=1920\" credit=\"Wikimedia Commons, CC BY-SA 4.0\" placeholder=\"Drop a photo: Makoko on stilts or Lagos traffic\"><\u002Fimage-slot>\n    <div style=\"position:absolute;inset:0;background:linear-gradient(90deg,rgba(38,44,102,.94) 0 45%,rgba(38,44,102,.25));pointer-events:none\"><\u002Fdiv>\n    <div style=\"position:absolute;left:110px;top:70px;right:110px;display:flex;justify-content:space-between;align-items:flex-start;color:#f6ead6\">\n      <div style=\"display:flex;flex-direction:column;gap:14px;max-width:1000px\">\n        <div style=\"font-size:24px;letter-spacing:.22em;text-transform:uppercase;color:#e9a23b;font-weight:700\">Law 7 of 9 · Rural to urban · Nigeria<\u002Fdiv>\n        <h2 style=\"margin:0;font-family:'DM Serif Display',serif;font-weight:400;font-size:58px;line-height:1.08;text-wrap:balance\">\"The major direction of migration is from farms to cities.\"<\u002Fh2>\n        <div style=\"font-size:21px;opacity:.8\">Makoko, Lagos: a neighborhood of 100,000+ built on stilts over the lagoon.<\u002Fdiv>\n      <\u002Fdiv>\n      <img src=\"https://commons.wikimedia.org/wiki/Special:FilePath/Nigeria%20(orthographic%20projection).svg?width=300\" alt=\"Nigeria locator\" style=\"width:150px;height:150px;border-radius:50%;background:#f6ead6;box-shadow:0 8px 24px rgba(0,0,0,.35)\">\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"padding:44px 110px 56px;display:grid;grid-template-columns:1fr 1fr;gap:60px;min-height:0\">\n    <div style=\"position:relative;display:flex;flex-direction:column;gap:18px;min-height:0\">\n      <div style=\"font-size:26px;font-weight:700\">Population of Lagos urban agglomeration (millions)<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(6,1fr);gap:16px;align-items:end;height:300px\">\n        <sc-for list=\"{{ lagos }}\" as=\"row\" hint-placeholder-count=\"6\">\n          <div style=\"display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end\">\n            <div style=\"font-family:'DM Serif Display',serif;font-size:32px\">{{ row.value }}<\u002Fdiv>\n            <div style=\"width:100%;background:#e9a23b;border-radius:4px 4px 0 0;height:{{ row.w }}%\"><\u002Fdiv>\n            <div style=\"font-size:22px;font-weight:600\">{{ row.year }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:30px;align-items:center;background:#262c66;color:#f6ead6;border-radius:6px;padding:14px 24px;font-size:24px;flex-wrap:wrap\">\n        <div style=\"font-size:20px;letter-spacing:.14em;text-transform:uppercase;color:#e9a23b;font-weight:700\">Nigeria % urban<\u002Fdiv>\n        <div><strong>1960<\u002Fstrong> 15%<\u002Fdiv><div><strong>1990<\u002Fstrong> 30%<\u002Fdiv><div><strong>2023<\u002Fstrong> 54%<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-size:19px;color:#6b6580\">Source: UN World Urbanization Prospects 2018; World Bank WDI. Rounded.<\u002Fdiv>\n      <sc-if value=\"{{ hidden.l7 }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"position:absolute;inset:-16px;background:#262c66;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;color:#f6ead6;padding:50px;text-align:center\">\n          <div style=\"font-family:'Caveat',cursive;font-size:40px;color:#b7d0f0;line-height:1\">Predict first<\u002Fdiv>\n          <div style=\"font-family:'DM Serif Display',serif;font-size:40px;line-height:1.2;text-wrap:balance\">Lagos had 1.4 million people in 1970. How many does it have today?<\u002Fdiv>\n          <button sc-camel-on-click=\"{{ reveal.l7 }}\" style=\"margin-top:6px;background:#e9a23b;color:#1d1a2b;border:0;border-radius:999px;padding:16px 40px;font-size:25px;font-weight:700\">Reveal data<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:16px;min-height:0\">\n      <div style=\"display:flex;gap:36px\">\n        <div style=\"display:flex;flex-direction:column;gap:2px\"><div style=\"font-family:'DM Serif Display',serif;font-size:50px;line-height:1\">2,000+<\u002Fdiv><div style=\"font-size:19px;color:#6b6580\">new Lagosians every day<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:2px\"><div style=\"font-family:'DM Serif Display',serif;font-size:50px;line-height:1\">1M<\u002Fdiv><div style=\"font-size:19px;color:#6b6580\">jobs in Nollywood<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:2px\"><div style=\"font-family:'DM Serif Display',serif;font-size:50px;line-height:1\">2050<\u002Fdiv><div style=\"font-size:19px;color:#6b6580\">Nigeria passes the US in population<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-family:'Caveat',cursive;font-size:36px;color:#c2641f;line-height:1\">Real life · Nollywood and the danfo<\u002Fdiv>\n      <p style=\"margin:0;font-size:21px;line-height:1.45;text-wrap:pretty\">Nigeria's film industry, based in Lagos, releases more films a year than Hollywood; only India makes more. It draws actors, editors and dreamers from every state. Getting around means the danfo, yellow minibuses that carry millions of riders a day through traffic locals call \"go-slow.\" Push from the countryside: shrinking plots, desertification in the north, insecurity. Pull to Lagos: jobs, schools, electricity, Afrobeats, the chance to be seen.<\u002Fp>\n      <div style=\"margin-top:auto;display:grid;grid-template-columns:auto 1fr 1fr;gap:20px;align-items:center;background:#fff8ec;border:2px solid #e6d3b3;border-radius:8px;padding:16px 24px\">\n        <div style=\"font-family:'Caveat',cursive;font-size:30px;color:#c2641f;line-height:1\">Then / now<\u002Fdiv>\n        <div style=\"font-size:20px;line-height:1.4\"><strong>England, 1851.<\u002Fstrong> First country in history with more people in cities than on farms.<\u002Fdiv>\n        <div style=\"font-size:20px;line-height:1.4\"><strong>Nigeria, 2019.<\u002Fstrong> Cross
