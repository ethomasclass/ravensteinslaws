es the same line, 168 years later and with 200 million people.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Law 8 · Youth\" data-screen-label=\"12\" data-speaker-notes=\"US Current Population Survey. Mobility peaks in the 20s: college, first jobs, marriage. Falls to 5% for 45–64. Austin as a magnet for 20-somethings. Then/now: Ravenstein wrote that most migrants are adults, and families rarely move.\" style=\"position:relative;overflow:hidden;isolation:isolate;width:1920px;height:1080px;box-sizing:border-box;padding:70px 110px 60px;background:#262c66;color:#f6ead6;font-family:'Nunito Sans',sans-serif;display:flex;flex-direction:column;gap:28px\">\n  <div style=\"position:absolute;inset:0;z-index:-2;pointer-events:none;background:url(https://commons.wikimedia.org/wiki/Special:FilePath/Austin%2C%20Texas%20Skyline%202018.jpg?width=1600) center/cover;opacity:.18;filter:grayscale(.6);mask-image:linear-gradient(0deg,rgba(0,0,0,1),rgba(0,0,0,0) 60%);-webkit-mask-image:linear-gradient(0deg,rgba(0,0,0,1),rgba(0,0,0,0) 60%)\"><\u002Fdiv>\n  <div style=\"position:absolute;inset:0;z-index:-1;pointer-events:none;background-image:url('data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%27200%27%20height%3D%27200%27%3E%3Cfilter%20id%3D%27n%27%3E%3CfeTurbulence%20type%3D%27fractalNoise%27%20baseFrequency%3D%27.9%27%20numOctaves%3D%272%27%20stitchTiles%3D%27stitch%27%2F%3E%3CfeColorMatrix%20values%3D%270%200%200%200%200%200%200%200%200%200%200%200%200%200%200%200%200%200%20.55%200%27%2F%3E%3C%2Ffilter%3E%3Crect%20width%3D%27200%27%20height%3D%27200%27%20filter%3D%27url(%23n)%27%2F%3E%3C%2Fsvg%3E');background-size:200px 200px;opacity:.4;mix-blend-mode:multiply\"><\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:1fr auto;gap:40px;align-items:start\">\n    <div style=\"display:flex;flex-direction:column;gap:14px\">\n      <div style=\"font-size:24px;letter-spacing:.22em;text-transform:uppercase;color:#e9a23b;font-weight:700\">Law 8 of 9 · Youth · United States<\u002Fdiv>\n      <h2 style=\"margin:0;font-family:'DM Serif Display',serif;font-weight:400;font-size:56px;line-height:1.08;text-wrap:balance\">\"Most migrants are adults; families rarely migrate.\"<\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:40px;align-items:center\">\n      <div style=\"display:flex;flex-direction:column;gap:2px\"><div style=\"font-family:'DM Serif Display',serif;font-size:50px;line-height:1;color:#f3c477\">1 in 5<\u002Fdiv><div style=\"font-size:19px;color:#b7d0f0\">Americans moved in 1948<\u002Fdiv><\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:2px\"><div style=\"font-family:'DM Serif Display',serif;font-size:50px;line-height:1;color:#f3c477\">8.7%<\u002Fdiv><div style=\"font-size:19px;color:#b7d0f0\">moved in 2022, a record low<\u002Fdiv><\u002Fdiv>\n      <img src=\"https://commons.wikimedia.org/wiki/Special:FilePath/United%20States%20(orthographic%20projection).svg?width=300\" alt=\"United States locator\" style=\"width:140px;height:140px;border-radius:50%;background:#f6ead6;box-shadow:0 8px 24px rgba(0,0,0,.35)\">\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"position:relative;background:#fff8ec;color:#1d1a2b;border-radius:8px;padding:30px 40px;display:flex;flex-direction:column;gap:18px\">\n    <div style=\"font-size:26px;font-weight:700\">Percent of each age group that changed residence in the past year<\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(9,1fr);gap:14px;align-items:end;height:300px\">\n      <sc-for list=\"{{ ages }}\" as=\"row\" hint-placeholder-count=\"9\">\n        <div style=\"display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end\">\n          <div style=\"font-family:'DM Serif Display',serif;font-size:30px\">{{ row.value }}<\u002Fdiv>\n          <div style=\"width:100%;background:{{ row.color }};border-radius:4px 4px 0 0;height:{{ row.w }}%\"><\u002Fdiv>\n          <div style=\"font-size:21px;font-weight:600;text-align:center\">{{ row.label }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"font-size:19px;color:#6b6580\">Source: US Census Bureau, Current Population Survey ASEC 2022, geographic mobility tables. Rounded.<\u002Fdiv>\n    <sc-if value=\"{{ hidden.l8 }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"position:absolute;inset:0;background:#3b4a8c;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;color:#f6ead6;padding:50px;text-align:center\">\n        <div style=\"font-family:'Caveat',cursive;font-size:40px;color:#b7d0f0;line-height:1\">Predict first<\u002Fdiv>\n        <div style=\"font-family:'DM Serif Display',serif;font-size:40px;line-height:1.2;text-wrap:balance\">Sketch the curve. Which age group moves most, and which moves least?<\u002Fdiv>\n        <button sc-camel-on-click=\"{{ reveal.l8 }}\" style=\"margin-top:6px;background:#e9a23b;color:#1d1a2b;border:0;border-radius:999px;padding:16px 40px;font-size:25px;font-weight:700\">Reveal data<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:60px;flex:1;min-height:0\">\n    <div style=\"display:flex;flex-direction:column;gap:12px\">\n      <div style=\"font-family:'Caveat',cursive;font-size:36px;color:#b7d0f0;line-height:1\">Real life · Austin, Texas<\u002Fdiv>\n      <p style=\"margin:0;font-size:21px;line-height:1.45;text-wrap:pretty\">Through the 2010s the Austin metro gained well over 100 residents a day, one of the fastest rates of any large US metro. The arrivals skewed young: University of Texas graduates who stayed, tech workers following Dell, Apple, Oracle and Tesla, musicians drawn by the live-music scene. Austin's median age, about 34, is five years below the national figure, and rents rose faster than almost anywhere in the country. Denver, Nashville and Raleigh show the same pattern.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:14px\">\n      <div style=\"display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:start;border-top:2px solid rgba(214,190,120,.4);padding-top:16px\">\n        <div style=\"font-family:'Caveat',cursive;font-size:30px;color:#f3c477;line-height:1;white-space:nowrap\">Then / now<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:8px;font-size:20px;line-height:1.4\"><div><strong style=\"color:#b7d0f0\">1885.<\u002Fstrong> Ravenstein: young adults leave the farm for the mill town; whole families rarely move together.<\u002Fdiv><div><strong style=\"color:#b7d0f0\">2022.<\u002Fstrong> Mobility peaks at 25–29, then falls as homeownership, two-career households and children anchor people in place.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-size:19px;opacity:.6;margin-top:auto\">Background: Austin skyline, Wikimedia Commons, CC BY-SA 4.0.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Law 9 · Gender\" data-screen-label=\"13\" data-speaker-notes=\"Three cases. India supports Ravenstein (women dominate short internal moves, largely marriage). Qatar supports it (men dominate long international labor migration). The Philippines breaks it: a female-majority international flow into domestic and care work. Bagong bayani = new heroes.\" style=\"position:relative;overflow:hidden;isolation:isolate;width:1920px;height:1080px;box-sizing:border-box;padding:70px 110px 60px;background:#f6ead6;color:#1d1a2b;font-family:'Nunito Sans',sans-serif;display:grid;grid-template-columns:1fr 620px;gap:70px\">\n  <div style=\"position:absolute;inset:0;z-index:-1;pointer-events:none;background-image:url('data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%27200%27%20height%3D%27200%27%3E%3Cfilter%20id%3D%27n%27%3E%3CfeTurbulence%20type%3D%27fractalNoise%27%20baseFrequency%3D%27.9%27%20numOctaves%3D%272%27%20stitchTiles%3D%27stitch%27%2F%3E%3CfeColorMatrix%20values%3D%270%200%200%200%200%200%200%200%200%200%200%200%200%200%200%200%200%200%20.55%200%27%2F%3E%3C%2Ffilter%3E%3Crect%20width%3D%27200%27%20height%3D%27200%27%20filter%3D%27url(%23n)%27%2F%3E%3C%2Fsvg%3E');background-size:200px 200px;opacity:.5;mix-blend-mode:multiply\"><\u002Fdiv>\n  <div style=\"display:flex;flex-direction:column;gap:26px;min-height:0\">\n    <div style=\"font-size:24px;letter-spacing:.22em;text-transform:uppercase;color:#c2641f;font-weight:700\">Law 9 of 9 · Gender · India, Qatar, Philippines<\u002Fdiv>\n    <h2 style=\"margin:0;font-family:'DM Serif Display',serif;font-weight:400;font-size:54px;line-height:1.08;text-wrap:balance\">\"Women migrate more within their country; men migrate more internationally.\"<\u002Fh2>\n    <div style=\"display:flex;gap:10px\">\n      <sc-for list=\"{{ genderTabs }}\" as=\"t\" hint-placeholder-count=\"3\"><button sc-camel-on-click=\"{{ t.onClick }}\" style=\"border:2px solid #c2641f;border-radius:999px;padding:10px 22px;font-size:22px;font-weight:700;background:{{ t.bg }};color:{{ t.fg }}\">{{ t.label }}<\u002Fbutton><\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"flex:1;min-height:0;background:#fff8ec;border:2px solid #e6d3b3;border-radius:8px;padding:40px 44px;display:flex;flex-direction:column;gap:28px\">\n      <div style=\"font-family:'DM Serif Display',serif;font-size:38px;line-height:1.15;text-wrap:balance\">{{ gTitle }}<\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:14px\">\n        <div style=\"display:flex;justify-content:space-between;font-size:26px;font-weight:700\"><span style=\"color:#c2641f\">Women {{ gWomen }}%<\u002Fspan><span style=\"color:#3b4a8c\">Men {{ gMen }}%<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;height:70px;border-radius:6px;overflow:hidden\"><div style=\"background:#e9a23b;width:{{ gWomen }}%;transition:width .4s\"><\u002Fdiv><div style=\"background:#3b4a8c;flex:1\"><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:30px\">\n        <div style=\"display:flex;flex-direction:column;gap:8px\"><div style=\"font-size:21px;letter-spacing:.14em;text-transform:uppercase;color:#6b6580;font-weight:700\">Type of move<\u002Fdiv><div style=\"font-size:25px;line-height:1.35\">{{ gType }}<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:8px\"><div style=\"font-size:21px;letter-spacing:.14em;text-transform:uppercase;color:#6b6580;font-weight:700\">Main driver<\u002Fdiv><div style=\"font-size:25px;line-height:1.35\">{{ gDriver }}<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"margin-top:auto;font-size:20px;color:#6b6580\">{{ gSource }}<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:flex;flex-direction:column;gap:16px;min-height:0\">\n    <div style=\"position:relative;height:300px;border-radius:8px;overflow:hidden\">\n      <image-slot id=\"img-l9\" shape=\"rect\" src=\"https://commons.wikimedia.org/wiki/Special:FilePath/Ninoy%20Aquino%20International%20Airport%20Terminal%203.jpg?width=1600\" credit=\"Wikimedia Commons, CC BY-SA\" placeholder=\"Drop a photo: Manila airport departures or a remittance center\"><\u002Fimage-slot>\n      <img src=\"https://commons.wikimedia.org/wiki/Special:FilePath/Philippines%20(orthographic%20projection).svg?width=300\" alt=\"Philippines locator\" style=\"position:absolute;top:18px;right:18px;width:120px;height:120px;border-radius:50%;background:#f6ead6;box-shadow:0 8px 24px rgba(0,0,0,.35)\">\n    <\u002Fdiv>\n    <div style=\"font-family:'Caveat',cursive;font-size:36px;color:#c2641f;line-height:1\">Real life · bagong bayani<\u002Fdiv>\n    <div style=\"font-family:'DM Serif Display',serif;font-size:30px;line-height:1.15;text-wrap:balance\">The \"new heroes\" who send home $37 billion a year<\u002Fdiv>\n    <p style=\"margin:0;font-size:21px;line-height:1.45;text-wrap:pretty\">The Philippine government's official name for its roughly 2 million overseas workers, who sent home about $37 billion in 2023, close to a tenth of the economy. A majority are women: nurses in Riyadh, domestic helpers in Hong Kong and Singapore, caregivers in Canada. Many leave their own children with grandparents for years. Every December, airports hold welcome ceremonies for returning OFWs. Geographers call this the feminization of migration, a pattern Ravenstein did not foresee.<\u002Fp>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:auto\">\n      <div style=\"display:flex;flex-direction:column;gap:2px\"><div style=\"font-family:'DM Serif Display',serif;font-size:46px;line-height:1\">1 in 10<\u002Fdiv><div style=\"font-size:19px;color:#6b6580\">Filipinos lives or works abroad<\u002Fdiv><\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:2px\"><div style=\"font-family:'DM Serif Display',serif;font-size:46px;line-height:1\">88%<\u002Fdiv><div style=\"font-size:19px;color:#6b6580\">of Qatar's population are migrants, the highest share on earth<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Verdict board\" data-screen-label=\"14\" data-speaker-notes=\"Wrap-up. Click each tile to cycle the class verdict (Holds / Weakened / Reversed) as students report from their worksheets. 'Show expected' reveals the teacher key; keep it hidden until the tally is done.\" style=\"width:1920px;height:1080px;position:relative;overflow:hidden;isolation:isolate;box-sizing:border-box;padding:80px 130px;background:repeating-linear-gradient(180deg,rgba(169,196,232,.10) 0 68px,rgba(169,196,232,0) 68px 136px),#262c66;color:#f6ead6;font-family:'Nunito Sans',sans-serif;display:flex;flex-direction:column;gap:36px\">\n  <div style=\"position:absolute;inset:0;z-index:-1;pointer-events:none;background-image:url('data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%27200%27%20height%3D%27200%27%3E%3Cfilter%20id%3D%27n%27%3E%3CfeTurbulence%20type%3D%27fractalNoise%27%20baseFrequency%3D%27.9%27%20numOctaves%3D%272%27%20stitchTiles%3D%27stitch%27%2F%3E%3CfeColorMatrix%20values%3D%270%200%200%200%200%200%200%200%200%200%200%200%200%200%200%200%200%200%20.55%200%27%2F%3E%3C%2Ffilter%3E%3Crect%20width%3D%27200%27%20height%3D%27200%27%20filter%3D%27url(%23n)%27%2F%3E%3C%2Fsvg%3E');background-size:200px 200px;opacity:.35;mix-blend-mode:multiply\"><\u002Fdiv>\n  <div style=\"position:absolute;inset:34px;border:2px solid rgba(214,190,120,.55);box-shadow:inset 0 0 0 8px #262c66,inset 0 0 0 10px rgba(169,196,232,.4);pointer-events:none\"><\u002Fdiv>\n  <div style=\"display:flex;justify-content:space-between;align-items:flex-end;gap:40px\">\n    <div style=\"display:flex;flex-direction:column;gap:12px\">\n      <div style=\"font-size:24px;letter-spacing:.22em;text-transform:uppercase;color:#e9a23b;font-weight:700\">Class verdict<\u002Fdiv>\n      <h2 style=\"margin:0;font-family:'DM Serif Display',serif;font-weight:400;font-size:66px;line-height:1.05\">Which laws survived 140 years?<\u002Fh2>\n      <div style=\"font-size:23px;color:#b7d0f0\">Click a tile to record the class verdict for each law.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:14px;align-items:center\">\n      <div style=\"display:flex;gap:18px;font-size:21px;margin-right:16px\"><span style=\"display:flex;align-items:center;gap:8px\"><i style=\"width:16px;height:16px;border-radius:50%;background:#8fc47a\"><\u002Fi>Holds<\u002Fspan><span style=\"display:flex;align-items:center;gap:8px\"><i style=\"width:16px;height:16px;border-radius:50%;background:#e9a23b\"><\u002Fi>Weakened<\u002Fspan><span style=\"display:flex;align-items:center;gap:8px\"><i style=\"width:16px;height:16px;border-radius:50%;background:#e06b56\"><\u002Fi>Reversed<\u002Fspan><\u002Fdiv>\n      <button sc-camel-on-click=\"{{ toggleKey }}\" style=\"border:2px solid #e9a23b;border-radius:999px;padding:10px 24px;font-size:21px;font-weight:700;background:transparent;color:#e9a23b\">{{ keyLabel }}<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:20px;flex:1;min-height:0\">\n    <sc-for list=\"{{ board }}\" as=\"b\" hint-placeholder-count=\"9\">\n      <button sc-camel-on-click=\"{{ b.onClick }}\" style=\"text-align:left;border:2px solid rgba(214,190,120,.35);border-radius:8px;padding:22px 26px;background:{{ b.bg }};color:{{ b.fg }};display:flex;flex-direction:column;gap:10px;transition:all .25s\">\n        <div style=\"display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%\">\n          <div style=\"font-size:25px;font-weight:700\">{{ b.law }}<\u002Fdiv>\n          <div style=\"font-size:19px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:6px 14px;border-radius:999px;background:{{ b.pillBg }};color:{{ b.pillFg }}\">{{ b.verdict }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:20px;line-height:1.35;opacity:.85\">{{ b.country }}<\u002Fdiv>\n        <sc-if value=\"{{ showKey }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"font-size:19px;line-height:1.4;border-top:1px solid rgba(255,255,255,.25);padding-top:10px;text-wrap:pretty\"><strong>Expected: {{ b.expected }}.<\u002Fstrong> {{ b.evidence }}<\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fbutton>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<\u002Fx-import>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { hidden: { l1: true, l2: true, l3: true, l6: true, l7: true, l8: true }, origin: 'sp', step: 0, gcase: 'india', verdicts: {}, showKey: false };\n  cities = {\n    sp: { name: 'São Paulo', pop: 11.45 }, rio: { name: 'Rio de Janeiro', pop: 6.21 }, bsb: { name: 'Brasília', pop: 2.82 },\n    sal: { name: 'Salvador', pop: 2.42 }, man: { name: 'Manaus', pop: 2.06 }, rec: { name: 'Recife', pop: 1.49 }\n  };\n  dist = { 'sp-rio': 360, 'sp-bsb': 870, 'sp-sal': 1450, 'sp-man': 2700, 'sp-rec': 2130, 'rio-bsb': 930, 'rio-sal': 1200, 'rio-man': 2850, 'rio-rec': 1870, 'bsb-sal': 1060, 'bsb-man': 1930, 'bsb-rec': 1660 };\n  d(a, b) { return this.dist[a + '-' + b] ?? this.dist[b + '-' + a]; }\n  stepData = [\n    { n: 1, place: 'Home village', size: 'Kisii County · ~2,000 people', h: 150, title: 'Leaving the farm', body: 'Land is split among siblings and plots shrink each generation. A cousin says there is casual work in the market town 20 km away. The first move is short, cheap, and reversible.' },\n    { n: 2, place: 'Market town', size: 'Kisii town · ~110,000 · 20 km', h: 200, title: 'First wage, first network', body: 'Work at a hardware stall pays cash and comes with stories about Kisumu: a bigger market, technical colleges, better phones. Savings from here fund the next ticket.' },\n    { n: 3, place: 'Regional city', size: 'Kisumu · ~400,000 · 110 km', h: 260, title: 'Skills and a bigger market', body: 'A two-year course and a boda-boda job. Kisumu has more, but the highest wages and the head offices are in the capital. Relatives already in Nairobi offer a room.' },\n    { n: 4, place: 'Capital', size: 'Nairobi · ~4.4 million · 300 km', h: 330, title: 'The great center', body: 'Each step used the network and savings built at the last one. Notice that no single move was very long, yet the migrant ends up 300 km from home, in the largest city.' }\n  ];\n  gender = {\n    india: { label: 'India · internal', title: 'India: internal migrants, Census 2011', women: 68, type: 'Short-distance, within state or district', driver: 'Marriage: women move to the husband\\'s village. Also work and education.', source: 'Source: Census of India 2011, D-series migration tables. Rounded.' },\n    qatar: { label: 'Qatar · international', title: 'Qatar: international migrant stock, 2020', women: 22, type: 'Long-distance, international, temporary labor', driver: 'Construction, transport and service jobs recruited from South Asia under contract.', source: 'Source: UN DESA International Migrant Stock 2020. Rounded.' },\n    ph: { label: 'Philippines · international', title: 'Philippines: overseas Filipino workers, 2023', women: 56, type: 'Long-distance, international, contract labor', driver: 'Domestic work, nursing and care jobs abroad, largely in the Gulf, Hong Kong and Singapore.', source: 'Source: Philippine Statistics Authority, Survey on Overseas Filipinos 2023. Rounded.' }\n  };\n  laws = [\n    { n: 1, name: 'Short distance', text: 'Most migrants move only a short distance.', country: 'India', expected: 'Holds', evidence: '62% of India\\'s internal migrants stayed in their district; only 12% crossed a state line. Marriage migration is short by nature.' },\n    { n: 2, name: 'Distance decay', text: 'The farther the destination, the fewer people go there.', country: 'Syrians abroad', expected: 'Weakened', evidence: 'Neighbors host most Syrians, but Germany at ~3,000 km is an outlier: policy lowered the intervening obstacles in 2015.' },\n    { n: 3, name: 'Urban areas', text: 'Long-distance migrants head for great centers of commerce and industry.', country: 'China', expected: 'Holds', evidence: 'Migrants are 68% of Shenzhen and 38–50% of other megacities vs. 27% nationally.' },\n    { n: 4, name: 'Gravity model', text: 'Bigger places attract more; farther places attract less.', country: 'Brazil', expected: 'Holds', evidence: 'From São Paulo, Rio dominates. Drought pushed Northeast flows above what distance alone predicts.' },\n    { n: 5, name: 'Step migration', text: 'Migration proceeds step by step: village, town, city.', country: 'Kenya', expected: 'Holds', evidence: 'Each step is short and funded by the last; networks accumulate. Cheap transport may let some skip steps.' },\n    { n: 6, name: 'Counter migration', text: 'Each main current produces a compensating counter-current.', country: 'Mexico ↔ US', expected: 'Holds', evidence: 'After 2008 the return flow exceeded the main flow: recession, enforcement, family reunification.' },\n    { n: 7, name: 'Rural to urban', text: 'The major direction of migration is from farms to cities.', country: 'Nigeria', expected: 'Holds', evidence: 'Lagos ~12× larger than 1970; Nigeria 15% → 54% urban. Growth this fast implies heavy in-migration.' },\n    { n: 8, name: 'Youth', text: 'Most migrants are adults; families rarely migrate.', country: 'United States', expected: 'Holds', evidence: 'Mobility peaks at 25–29 (20%) and falls to 5% for 45–64 as families and homeownership anchor people.' },\n    { n: 9, name: 'Gender', text: 'Women migrate more internally; men more internationally.', country: 'India · Qatar · Philippines', expected: 'Weakened', evidence: 'India and Qatar fit. The Philippines breaks it: a female-majority international flow into care and domestic work.' }\n  ];\n  cycle = ['—', 'Holds', 'Weakened', 'Reversed'];\n  renderVals() {\n    const s = this.state;\n    const reveal = {}, hidden = {};\n    for (const k of ['l1', 'l2', 'l3', 'l6', 'l7', 'l8']) {\n      hidden[k] = !!s.hidden[k];\n      reveal[k] = () => this.setState(p => ({ hidden: { ...p.hidden, [k]: false } }));\n    }\n    const origin = this.cities[s.origin];\n    const raw = Object.keys(this.cities).filter(k => k !== s.origin).map(k => { const c = this.cities[k], dk = this.d(s.origin, k); return { city: c.name, pop: c.pop.toFixed(1), dist: dk.toLocaleString(), val: origin.pop * c.pop / Math.pow(dk / 100, 2) }; }).sort((a, b) => b.val - a.val);\n    const max = raw[0].val;\n    const gravityRows = raw.map(r => ({ ...r, index: r.val.toFixed(2), w: Math.max(1, r.val / max * 100) }));\n    const originButtons = ['sp', 'rio', 'bsb'].map(k => ({ label: this.cities[k].name, onClick: () => this.setState({ origin: k }), bg: k === s.origin ? '#e9a23b' : 'transparent', fg: k === s.origin ? '#1d1a2b' : '#f3c477' }));\n    const steps = this.stepData.map((st, i) => ({ ...st, onClick: () => this.setState({ step: i }), bg: i === s.step ? '#262c66' : '#fff8ec', fg: i === s.step ? '#f6ead6' : '#1d1a2b' }));\n    const cur = this.stepData[s.step];\n    const g = this.gender[s.gcase];\n    const genderTabs = Object.keys(this.gender).map(k => ({ label: this.gender[k].label, onClick: () => this.setState({ gcase: k }), bg: k === s.gcase ? '#c2641f' : 'transparent', fg: k === s.gcase ? '#fff8ec' : '#c2641f' }));\n    const pct = (v, m) => Math.round(v / m * 100);\n    const tone = { '—': ['rgba(246,234,214,.08)', '#f6ead6', 'rgba(246,234,214,.15)', '#f6ead6'], Holds: ['#8fc47a', '#1d1a2b', '#1d1a2b', '#dfe9d3'], Weakened: ['#e9a23b', '#1d1a2b', '#1d1a2b', '#fbe6bd'], Reversed: ['#e06b56', '#fff8ec', '#1d1a2b', '#f3d4cc'] };\n    const board = this.laws.map(l => {\n      const v = s.verdicts[l.n] ?? '—'; const t = tone[v];\n      return { law: l.n + ' · ' + l.name, country: l.country, verdict: v === '—' ? 'Tap to vote' : v, expected: l.expected, evidence: l.evidence, bg: t[0], fg: t[1], pillBg: t[2], pillFg: t[3],\n        onClick: () => this.setState(p => ({ verdicts: { ...p.verdicts, [l.n]: this.cycle[(this.cycle.indexOf(p.verdicts[l.n] ?? '—') + 1) % 4] } })) };\n    });\n    return {\n      hidden, reveal,\n      lawTiles: this.laws,\n      vocab: [\n        { term: 'Migration', def: 'A permanent or long-term move to a new place of residence.' },\n        { term: 'Internal vs. international', def: 'Moving within a country vs. across a national border.' },\n        { term: 'Push / pull factors', def: 'Conditions that drive people out of a place, or draw them to one.' },\n        { term: 'Distance decay', def: 'Interaction between places weakens as the distance between them grows.' },\n        { term: 'Gravity model', def: 'Predicts interaction from the sizes of two places and the distance between them.' },\n        { term: 'Step migration', def: 'A long move made as a series of shorter moves up the urban hierarchy.' },\n        { term: 'Counter migration', def: 'A return flow that runs opposite to the main current.' },\n        { term: 'Intervening opportunity', def: 'A closer alternative destination that captures migrants before they reach a farther one.' }\n      ],\n      india: [{ label: 'Within the same district', value: '62%', w: 62 }, { label: 'Another district, same state', value: '26%', w: 26 }, { label: 'Another state', value: '12%', w: 12 }],\n      syria: [\n        { label: 'Lebanon', dist: '~90 km', value: '0.8M', w: pct(0.8, 3.2), color: '#e9a23b' },\n        { label: 'Jordan', dist: '~180 km', value: '0.65M', w: pct(0.65, 3.2), color: '#e9a23b' },\n        { label: 'Iraq', dist: '~750 km', value: '0.27M', w: pct(0.27, 3.2), color: '#e9a23b' },\n        { label: 'Türkiye', dist: '~800 km', value: '3.2M', w: 100, color: '#e9a23b' },\n        { label: 'Germany', dist: '~3,000 km', value: '0.97M', w: pct(0.97, 3.2), color: '#d9713a' },\n        { label: 'Sweden', dist: '~3,800 km', value: '0.2M', w: pct(0.2, 3.2), color: '#e9a23b' },\n        { label: 'United States', dist: '~9,500 km', value: '0.04M', w: 2, color: '#e9a23b' }\n      ],\n      china: [\n        { label: 'Shenzhen', value: '68%', w: 68, color: '#e9a23b', weight: 600 }, { label: 'Guangzhou', value: '50%', w: 50, color: '#e9a23b', weight: 600 },\n        { label: 'Shanghai', value: '42%', w: 42, color: '#e9a23b', weight: 600 }, { label: 'Beijing', value: '38%', w: 38, color: '#e9a23b', weight: 600 },\n        { label: 'China overall', value: '27%', w: 27, color: '#3b4a8c', weight: 700 }\n      ],\n      originName: origin.name, originButtons, gravityRows,\n      steps, stepTitle: cur.title, stepBody: cur.body,\n      mexico: [\n        { period: '1995–2000', toUs: '2.94M', toMx: '0.67M', wUs: 100, wMx: pct(0.67, 2.94) },\n        { period: '2005–2010', toUs: '1.37M', toMx: '1.39M', wUs: pct(1.37, 2.94), wMx: pct(1.39, 2.94) },\n        { period: '2009–2014', toUs: '0.87M', toMx: '1.00M', wUs: pct(0.87, 2.94)
